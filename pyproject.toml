[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-background"
version = "1.0.0"
description = "Create dark street-map images from OpenStreetMap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopy>=2.4",
    "matplotlib>=3.8",
    "osmnx>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
map-background = "map_background.cli:main"

[tool.setuptools.packages.find]
include = ["map_background*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
